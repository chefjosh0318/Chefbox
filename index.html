<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Summit Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0E0F13;color:#fff;font-family:'Inter',sans-serif;overflow:hidden;height:100vh;width:100vw}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
:root{--accent:#2DD4A8;--bg:rgba(14,15,19,0.15);--blur:blur(14px);--border:rgba(255,255,255,0.06)}
.glass{background:var(--bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border)}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:56px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--border)}
.wordmark{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.wordmark-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.wordmark-sub{font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3)}
#tg-bar{flex:1;max-width:380px;margin:0 20px;display:flex;gap:8px}
#tg-input{flex:1;padding:6px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#fff;font-size:12px;font-family:inherit;outline:none}
#tg-input::placeholder{color:rgba(255,255,255,.25)}
#tg-input:focus{border-color:rgba(45,212,168,.4)}
#tg-send{padding:6px 14px;background:var(--accent);border:none;border-radius:20px;color:#0E0F13;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
#tg-send:hover{opacity:.85}
.hdr-right{display:flex;align-items:center;gap:10px}
.ghost-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;color:rgba(255,255,255,.5);transition:color .2s,background .2s;position:relative}
.ghost-btn:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.06)}
.ghost-btn svg{width:18px;height:18px}
.badge{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#ff4757;border:1.5px solid #0E0F13}
#status-dot{width:10px;height:10px;border-radius:50%;background:#444;transition:background .3s}
#status-dot.listening{background:var(--accent);animation:pdot 1.2s ease-in-out infinite}
#status-dot.processing{background:#7c6bff;animation:pdot .8s ease-in-out infinite}
#status-dot.speaking{background:#fbbf24;animation:pdot 1s ease-in-out infinite}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}

/* LEFT PANELS */
#left-panels{position:fixed;top:68px;left:16px;z-index:10;width:256px;display:flex;flex-direction:column;gap:10px}
.data-panel{border-radius:12px;padding:14px;border-top:2px solid var(--accent)}
.panel-title{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;color:var(--accent);margin-bottom:10px}
.mrr-big{font-size:26px;font-weight:600;letter-spacing:-.03em}
.mrr-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.prog-bar{width:100%;height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin:8px 0}
.prog-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .8s ease}
.srow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.srow:last-child{border-bottom:none}
.slabel{font-size:11px;color:rgba(255,255,255,.4)}
.sval{font-size:11px;font-weight:500}
.sval.ok{color:var(--accent)}
.sval.warn{color:#fbbf24}
.sval.err{color:#ff4757}
.brand-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0}
.bdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.bname{font-size:12px;font-weight:500}
.bsub{font-size:10px;color:rgba(255,255,255,.35)}

/* RIGHT PANEL */
#activity-panel{position:fixed;top:56px;right:0;width:264px;height:calc(100vh - 56px - 120px);z-index:10;background:var(--bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-left:1px solid var(--border);overflow:hidden;transition:width .3s cubic-bezier(.16,1,.3,1)}
#activity-panel.collapsed{width:36px}
.ptoggle{position:absolute;top:8px;left:8px;width:20px;height:20px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;border-radius:4px;z-index:2}
.ptoggle:hover{color:rgba(255,255,255,.8)}
#panel-content{padding:8px 10px 12px 34px;overflow-y:auto;height:100%;opacity:1;transition:opacity .15s}
#activity-panel.collapsed #panel-content{opacity:0;pointer-events:none}
.sec-hdr{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin:12px 0 5px;display:flex;justify-content:space-between;align-items:center}
.sec-hdr:first-child{margin-top:5px}
.sec-cnt{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:8px;font-size:9px}
.sec-cnt.has-err{background:rgba(255,71,87,.15);color:#ff4757}
.entry{padding:7px 8px;border-radius:8px;margin-bottom:3px;border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.03);cursor:default;transition:background .15s;animation:sir .3s cubic-bezier(.16,1,.3,1) both}
@keyframes sir{from{transform:translateX(14px);opacity:0}to{transform:translateX(0);opacity:1}}
.entry-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.entry-left{display:flex;align-items:center;gap:5px}
.etitle{font-size:11px;font-weight:500;color:rgba(255,255,255,.9)}
.esub{font-size:10px;color:rgba(255,255,255,.35)}
.cdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cdot.ok{background:var(--accent)}
.cdot.error{background:#ff4757;animation:pdot 1s infinite}
.cdot.idle{background:rgba(255,255,255,.2)}
.run-btn{padding:2px 6px;background:rgba(45,212,168,.1);border:1px solid rgba(45,212,168,.2);border-radius:4px;color:var(--accent);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit}
.run-btn:hover{background:rgba(45,212,168,.2)}

/* MIC BAR */
#mic-bar{position:fixed;bottom:0;left:0;right:0;height:120px;z-index:10;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#mic-btn{width:64px;height:64px;border-radius:50%;background:#16171D;border:1px solid rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .25s,box-shadow .25s;pointer-events:all}
#mic-btn.active{border:2px solid var(--accent);box-shadow:0 0 24px rgba(45,212,168,.5)}
#mic-btn.active::before{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);animation:pring 1.4s cubic-bezier(.16,1,.3,1) infinite}
@keyframes pring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.65);opacity:0}}
#mic-btn svg{width:24px;height:24px}
#mic-hint{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);user-select:none}

/* RESPONSE CARD */
.resp-card{position:fixed;background:rgba(22,23,29,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-top:2px solid var(--accent);border-radius:12px;padding:14px;z-index:20;pointer-events:all;animation:ce .4s cubic-bezier(.16,1,.3,1) both;max-width:280px}
@keyframes ce{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.card-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:5px}
.card-val{font-size:13px;color:rgba(255,255,255,.9);line-height:1.5}
.card-x{position:absolute;top:8px;right:8px;width:18px;height:18px;border:none;background:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.card-x:hover{color:rgba(255,255,255,.7);background:rgba(255,255,255,.06)}

/* SKELETON */
.sk{background:linear-gradient(90deg,rgba(255,255,255,.05) 0%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;height:12px;margin-bottom:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* MODALS */
.modal-wrap{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);align-items:center;justify-content:center}
.modal-wrap.open{display:flex}
.modal-box{background:#16171d;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;width:500px;max-width:92vw;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-x{background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:18px;line-height:1}
.mrr-bar{display:flex;gap:20px;padding:12px;background:rgba(45,212,168,.06);border-radius:8px;margin-bottom:14px}
.mrr-cell{text-align:center;flex:1}
.mrr-cell-v{font-size:17px;font-weight:600}
.mrr-cell-l{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.07em}
.mem-row{display:grid;grid-template-columns:1fr 90px 70px 90px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.mem-row:last-child{border-bottom:none}
.mem-name{font-size:13px;font-weight:500}
.mem-svc{font-size:11px;color:rgba(255,255,255,.4)}
.mem-rate{font-size:12px;font-weight:500;color:var(--accent);text-align:right}
.mbadge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;text-align:center}
.mbadge.active{background:rgba(45,212,168,.12);color:var(--accent)}
.mbadge.paused{background:rgba(251,191,36,.12);color:#fbbf24}
.sf label{display:block;margin-bottom:3px;color:rgba(255,255,255,.4);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.sf input,.sf textarea{width:100%;margin-bottom:11px;padding:8px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:13px;font-family:inherit;outline:none}
.sf input:focus,.sf textarea:focus{border-color:rgba(45,212,168,.4)}
.sf textarea{resize:vertical}
.btn-primary{width:100%;padding:10px;background:var(--accent);border:none;border-radius:8px;color:#0E0F13;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.confirm-box{background:#16171d;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:24px;width:300px;text-align:center}
.confirm-ttl{font-size:14px;font-weight:600;margin-bottom:6px}
.confirm-msg{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:18px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600}
.btn-cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.btn-go{background:var(--accent);color:#0E0F13}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<header id="header">
  <div class="wordmark">
    <span data-agent-name>Jarvis</span>
    <div class="wordmark-dot"></div>
    <span class="wordmark-sub">Summit Labs</span>
  </div>
  <div id="tg-bar">
    <input id="tg-input" type="text" placeholder="Message Jarvis or send to Telegram…">
    <button id="tg-send">Send</button>
  </div>
  <div class="hdr-right">
    <button class="ghost-btn" id="members-btn" title="Active Members">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </button>
    <button class="ghost-btn" title="Alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="badge"></div>
    </button>
    <button class="ghost-btn" id="settings-btn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="status-dot"></div>
  </div>
</header>

<div id="left-panels">
  <div class="data-panel glass" id="revenue-panel">
    <div class="panel-title">MRR · Summit Brands</div>
    <div id="rev-content">
      <div class="sk" style="width:55%;height:26px;margin-bottom:6px"></div>
      <div class="sk" style="width:40%"></div>
    </div>
  </div>
  <div class="data-panel glass" style="border-top-color:#a78bfa" id="pipeline-panel">
    <div class="panel-title" style="color:#a78bfa">Lead Pipeline</div>
    <div id="pipe-content">
      <div class="sk"></div><div class="sk" style="width:80%"></div><div class="sk" style="width:65%"></div>
    </div>
  </div>
</div>

<div id="activity-panel">
  <button class="ptoggle" id="panel-toggle">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div id="panel-content">
    <div class="sk"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div>
  </div>
</div>

<div id="mic-bar">
  <button id="mic-btn">
    <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="9" y1="21" x2="15" y2="21"/></svg>
    <svg id="stop-icon" viewBox="0 0 24 24" fill="white" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
  <div id="mic-hint">TAP OR SAY 'HEY JARVIS'</div>
</div>

<!-- MEMBERS MODAL -->
<div class="modal-wrap" id="members-modal">
  <div class="modal-box">
    <div class="modal-title">Active Members — Summit Brands <button class="modal-x" id="members-close">✕</button></div>
    <div class="mrr-bar">
      <div class="mrr-cell"><div class="mrr-cell-v">$10,236</div><div class="mrr-cell-l">Active MRR</div></div>
      <div class="mrr-cell"><div class="mrr-cell-v">$10,000</div><div class="mrr-cell-l">Gap to Goal</div></div>
      <div class="mrr-cell"><div class="mrr-cell-v">7 / 9</div><div class="mrr-cell-l">Active / Total</div></div>
    </div>
    <div id="members-list"></div>
    <p style="font-size:10px;color:rgba(255,255,255,.2);margin-top:10px;text-align:center">Read-only · Contact info not displayed</p>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-wrap" id="settings-modal">
  <div class="modal-box sf">
    <div class="modal-title">Configuration <button class="modal-x" id="settings-close">✕</button></div>
    <label>Mission Control API URL (Cloudflare Tunnel)</label>
    <input id="s-mc" type="text" placeholder="https://your-tunnel.trycloudflare.com">
    <label>OpenClaw Gateway URL</label>
    <input id="s-oc" type="text" placeholder="http://127.0.0.1:18789">
    <label>Agent Name</label>
    <input id="s-name" type="text" placeholder="Jarvis">
    <label>Fallback AI API URL</label>
    <input id="s-url" type="text" placeholder="https://api.openai.com/v1/chat/completions">
    <label>Fallback API Key</label>
    <input id="s-key" type="password" placeholder="sk-…">
    <label>Model</label>
    <input id="s-model" type="text" placeholder="gpt-4o">
    <label>System Prompt</label>
    <textarea id="s-prompt" rows="3"></textarea>
    <button class="btn-primary" id="settings-save">Save &amp; Apply</button>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-wrap" id="confirm-modal">
  <div class="confirm-box">
    <div class="confirm-ttl" id="confirm-ttl">Confirm Action</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-btns">
      <button class="btn-cancel" id="confirm-cancel">Cancel</button>
      <button class="btn-go" id="confirm-ok">Run</button>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body>
</html>
